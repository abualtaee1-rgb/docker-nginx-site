name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Build the Docker image
        run: docker build -t my-web .
      - name: Test the container
        run: |
          docker run -d --name web -p 8080:80 my-web
          sleep 3
          curl --fail http://localhost:8080
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push the Docker image to GHCR
        run: |
           docker tag my-web ghcr.io/abualtaee1-rgb/docker-nginx-site:latest
           docker push ghcr.io/abualtaee1-rgb/docker-nginx-site:latest    